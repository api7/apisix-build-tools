name: package apisix-runtime deb for ubuntu 24.04

on:
  push:
    branches: [ master ]
    tags:
      - "v*"
    paths-ignore:
      - '*.md'
  pull_request:
    branches: [ master ]
    paths-ignore:
      - '*.md'
  schedule:
    - cron: '0 0 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      BUILD_APISIX_RUNTIME_VERSION: 1.4.3
    steps:
      - uses: actions/checkout@v2

      - name: install dependencies
        run: |
          sudo apt-get install -y make ruby ruby-dev rubygems build-essential

      # Same base image and packages as release-apisix-runtime.yml, so the
      # gateway CI can install the debug package as it does a released one.
      - name: build apisix-runtime deb
        run: |
          make package type=deb app=apisix-runtime runtime_version=${BUILD_APISIX_RUNTIME_VERSION} image_base=debian image_tag=bookworm-slim arch=linux/amd64

      - name: build apisix-runtime-debug deb
        run: |
          make package type=deb app=apisix-runtime runtime_version=${BUILD_APISIX_RUNTIME_VERSION} image_base=debian image_tag=bookworm-slim arch=linux/amd64 build_latest=latest artifact=apisix-runtime-debug

      - name: check the bundled nginx version
        run: |
          docker run --rm -v "$PWD/output:/output" debian:bookworm-slim bash -c \
            "apt-get update -qq && apt-get install -y -qq /output/apisix-runtime_${BUILD_APISIX_RUNTIME_VERSION}-0~debianbookworm-slim_amd64.deb >/dev/null && /usr/local/openresty/nginx/sbin/nginx -V"

      - name: Publish Artifact
        uses: actions/upload-artifact@v4.0.0
        with:
          name: apisix-runtime_${{ env.BUILD_APISIX_RUNTIME_VERSION }}-0~debianbookworm-slim_amd64.deb
          path: output/apisix-runtime_${{ env.BUILD_APISIX_RUNTIME_VERSION }}-0~debianbookworm-slim_amd64.deb
          retention-days: 5
          if-no-files-found: error

      - name: Publish Debug Artifact
        uses: actions/upload-artifact@v4.0.0
        with:
          name: apisix-runtime-debug_${{ env.BUILD_APISIX_RUNTIME_VERSION }}-0~debianbookworm-slim_amd64.deb
          path: output/apisix-runtime-debug_${{ env.BUILD_APISIX_RUNTIME_VERSION }}-0~debianbookworm-slim_amd64.deb
          retention-days: 5
          if-no-files-found: error
