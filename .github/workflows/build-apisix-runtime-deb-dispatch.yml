name: build apisix-runtime deb (dispatch)

# Build an apisix-runtime deb from an arbitrary apisix-nginx-module ref and
# publish it as a workflow artifact. Meant for testing a module branch before
# it is tagged and released.

on:
  workflow_dispatch:
    inputs:
      runtime_version:
        description: "apisix-runtime version to stamp into the package"
        required: true
        default: "1.3.8"
      apisix_nginx_module_ver:
        description: "apisix-nginx-module tag or branch (empty = the pinned default)"
        required: false
        default: ""
      image_base:
        description: "base image"
        required: false
        default: "debian"
      image_tag:
        description: "base image tag"
        required: false
        default: "bookworm-slim"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      RUNTIME_VERSION: ${{ inputs.runtime_version }}
      APISIX_NGINX_MODULE_VER: ${{ inputs.apisix_nginx_module_ver }}
      IMAGE_BASE: ${{ inputs.image_base }}
      IMAGE_TAG: ${{ inputs.image_tag }}
      BUILDKIT_PROGRESS: plain
    steps:
      - name: Validate inputs
        run: |
          if [[ ! "$RUNTIME_VERSION" =~ ^[0-9A-Za-z._-]+$ ]]; then
            echo "invalid runtime_version: $RUNTIME_VERSION" >&2
            exit 1
          fi
          if [[ -n "$APISIX_NGINX_MODULE_VER" && ! "$APISIX_NGINX_MODULE_VER" =~ ^[A-Za-z0-9._/-]+$ ]]; then
            echo "invalid apisix_nginx_module_ver: $APISIX_NGINX_MODULE_VER" >&2
            exit 1
          fi

      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y make ruby ruby-dev rubygems build-essential

      - name: Build apisix-runtime deb
        run: |
          make package type=deb app=apisix-runtime \
            runtime_version="$RUNTIME_VERSION" \
            apisix_nginx_module_ver="$APISIX_NGINX_MODULE_VER" \
            image_base="$IMAGE_BASE" image_tag="$IMAGE_TAG"

      - name: Smoke check the deb
        run: |
          deb=$(basename "$(ls output/apisix-runtime_*.deb)")
          echo "built $deb"
          docker run --rm -v "$PWD/output:/output" "$IMAGE_BASE:$IMAGE_TAG" bash -c "
            dpkg -i '/output/$deb'
            /usr/local/openresty/bin/openresty -V
          "

      - name: Publish artifact
        uses: actions/upload-artifact@v4
        with:
          name: apisix-runtime-deb-${{ inputs.runtime_version }}
          path: output/apisix-runtime_*.deb
          retention-days: 14
          if-no-files-found: error
